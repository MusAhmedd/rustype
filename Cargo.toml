[package]
name = "rustype"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
rodio = { version = "0.19", default-features = false }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
arboard = "3"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
